<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#142238">

<title>Generator Undangan — Kahfi & Ririn</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #142238;
  color: #eeece7;
  font-family: 'DM Sans', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
}

.generator {
  width: 100%;
  max-width: 440px;
  background: #eeece7;
  color: #142238;
  padding: 35px 25px;
  border-radius: 16px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
}

.monogram {
  font-family: 'Cormorant Garamond', serif;
  font-size: 48px;
  color: #142238;
  font-weight: 600;
}

.monogram span {
  color: #c4a86b;
}

.eyebrow {
  font-size: 10px;
  letter-spacing: 4px;
  margin: 5px 0 28px;
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 35px;
  font-weight: 500;
  margin: 0 0 10px;
}

.description {
  font-size: 13px;
  color: #6c7076;
  line-height: 1.7;
  margin-bottom: 27px;
}

label {
  display: block;
  text-align: left;
  font-size: 12px;
  margin-bottom: 9px;
  font-weight: 600;
}

input {
  width: 100%;
  padding: 15px;
  border: 1px solid #c9c6be;
  background: white;
  border-radius: 7px;
  font-size: 15px;
  outline: none;
  color: #142238;
}

input:focus {
  border-color: #c4a86b;
}

.result {
  margin-top: 22px;
  padding: 16px;
  background: #e2e0da;
  border-radius: 8px;
  text-align: left;
}

.result small {
  display: block;
  font-size: 10px;
  letter-spacing: 2px;
  color: #777;
}

#inviteLink {
  display: block;
  margin: 12px 0;
  font-size: 12px;
  line-height: 1.7;
  overflow-wrap: anywhere;
  color: #142238;
}

#inviteMessage {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 13px;
  line-height: 1.8;
  margin: 12px 0;
  color: #142238;
}

button {
  width: 100%;
  padding: 15px 10px;
  border: none;
  border-radius: 7px;
  background: #142238;
  color: white;
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.5px;
  cursor: pointer;
  transition: .2s;
}

button:active {
  transform: scale(.98);
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.footer {
  margin-top: 25px;
  font-size: 10px;
  letter-spacing: 2px;
  color: #777;
}
</style>
</head>

<body>

<div class="generator">

  <div class="monogram">K<span>&amp;</span>R</div>

  <p class="eyebrow">THE WEDDING OF</p>

  <h1>Generator Undangan</h1>

  <p class="description">
    Masukkan nama tamu untuk membuat link dan pesan
    undangan pribadi Kahfi &amp; Ririn.
  </p>

  <label for="guestName">NAMA TAMU UNDANGAN</label>

  <input
    type="text"
    id="guestName"
    placeholder="Contoh: Asmaul Husna"
    autocomplete="off"
  >

  <div class="result">

    <small>LINK UNDANGAN</small>

    <span id="inviteLink">Link akan muncul di sini.</span>

    <button id="copyBtn" disabled>
      COPY LINK
    </button>

  </div>

  <div class="result">

    <small>PESAN UNDANGAN LENGKAP</small>

    <div id="inviteMessage">Pesan undangan akan muncul di sini.</div>

    <button id="copyMessageBtn" disabled>
      SALIN PESAN UNDANGAN
    </button>

  </div>

  <div class="footer">
    KAHFI &amp; RIRIN · 2026
  </div>

</div>

<script>
const guestInput = document.getElementById('guestName');
const inviteLink = document.getElementById('inviteLink');
const copyBtn = document.getElementById('copyBtn');
const inviteMessage = document.getElementById('inviteMessage');
const copyMessageBtn = document.getElementById('copyMessageBtn');

const invitationURL =
  'https://12ashabul06-blip.github.io/wedding-kahfi-ririn/';

function generateInvitation() {
  const name = guestInput.value.trim();

  if (!name) {
    inviteLink.textContent = 'Link akan muncul di sini.';
    inviteMessage.textContent = 'Pesan undangan akan muncul di sini.';

    copyBtn.disabled = true;
    copyMessageBtn.disabled = true;

    copyBtn.textContent = 'COPY LINK';
    copyMessageBtn.textContent = 'SALIN PESAN UNDANGAN';

    return;
  }

  const link = invitationURL + '?to=' + encodeURIComponent(name);

  const message =
`Kepada Yth. Bapak/Ibu/Saudara/i ${name}

Tanpa mengurangi rasa hormat, perkenankan kami mengundang Anda untuk menghadiri momen istimewa kebahagiaan kami.

Detail lengkap mengenai waktu, lokasi, dan galeri acara dapat diakses melalui tautan undangan digital berikut:

${link}

Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Anda berkenan hadir untuk memberikan doa restu bagi kedua mempelai.

Terima kasih banyak atas perhatian dan pengertiannya.`;

  inviteLink.textContent = link;
  inviteMessage.textContent = message;

  copyBtn.disabled = false;
  copyMessageBtn.disabled = false;

  copyBtn.textContent = 'COPY LINK';
  copyMessageBtn.textContent = 'SALIN PESAN UNDANGAN';
}

guestInput.addEventListener('input', generateInvitation);

async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    await navigator.clipboard.writeText(text);
    return true;
  }

  const textarea = document.createElement('textarea');

  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.left = '-9999px';
  textarea.style.top = '0';

  document.body.appendChild(textarea);
  textarea.focus();
  textarea.select();

  const success = document.execCommand('copy');

  textarea.remove();

  if (!success) {
    throw new Error('Penyalinan gagal');
  }

  return true;
}

copyBtn.addEventListener('click', async () => {
  const name = guestInput.value.trim();

  if (!name) return;

  const link = invitationURL + '?to=' + encodeURIComponent(name);

  try {
    await copyText(link);
    copyBtn.textContent = 'LINK BERHASIL DISALIN ✓';
  } catch (error) {
    window.prompt('Salin link undangan berikut:', link);
  }
});

copyMessageBtn.addEventListener('click', async () => {
  const message = inviteMessage.textContent;

  if (!guestInput.value.trim()) return;

  try {
    await copyText(message);
    copyMessageBtn.textContent = 'PESAN BERHASIL DISALIN ✓';
  } catch (error) {
    window.prompt('Salin seluruh pesan undangan berikut:', message);
  }
});
</script>

</body>
</html>
